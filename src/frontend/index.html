<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patchwork: find open source projects that fit you</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="dist/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Patchwork</h1>
    <p>Open source projects, matched to what you can do and what you care about.</p>
  </header>
  <p id="status" class="status" role="status" hidden></p>

  <main class="layout">
    <aside class="profile" aria-label="Your profile">
      <h2>Your profile</h2>
      <label for="dev-name">Name</label>
      <input id="dev-name" type="text" autocomplete="name">

      <label for="skill-input">Skills and your level (1 to 5)</label>
      <div class="add-row">
        <input id="skill-input" type="text" placeholder="e.g. python">
        <select id="skill-level" aria-label="Skill level"></select>
        <button id="skill-add" type="button">Add</button>
      </div>
      <ul id="skill-list" class="chips"></ul>

      <label for="interest-input">Interests</label>
      <div class="add-row">
        <input id="interest-input" type="text" placeholder="e.g. data">
        <button id="interest-add" type="button">Add</button>
      </div>
      <ul id="interest-list" class="chips"></ul>

      <button id="profile-save" type="button" class="block">Save profile</button>
    </aside>

    <section class="feed" aria-label="Feed">
      <form id="composer" class="composer">
        <label for="pitch-title">Pitch your project</label>
        <input id="pitch-title" type="text" placeholder="Project name">
        <label for="pitch-repo">Repository link</label>
        <input id="pitch-repo" type="text" inputmode="url" placeholder="https://github.com/you/project">

        <label for="need-input">Skills you need and the level</label>
        <div class="add-row">
          <input id="need-input" type="text" placeholder="e.g. sql">
          <select id="need-level" aria-label="Needed level"></select>
          <button id="need-add" type="button">Add</button>
        </div>
        <ul id="need-list" class="chips"></ul>

        <label for="pitch-tags">Tags (comma separated)</label>
        <input id="pitch-tags" type="text" placeholder="data, open source">

        <div class="composer-row">
          <input id="pitch-video" type="file" accept="video/mp4,.mp4" aria-describedby="video-note">
          <span id="video-note" class="note">MP4 video up to 50 MB</span>
          <button id="pitch-submit" type="submit">Post pitch</button>
        </div>
      </form>

      <ol id="feed-list" class="posts"></ol>
    </section>

    <aside class="matches" aria-label="Your applications">
      <h2>Projects you applied to</h2>
      <ol id="match-list" class="matches-list"></ol>
    </aside>
  </main>
</body>
</html>
